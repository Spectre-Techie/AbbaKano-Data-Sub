<script>
  (function() {
    let pin = '123';
    const maxLen = 4;
    const container = document.getElementById('pin-indicator-container');

    function renderDots() {
      if (!container) return;
      const dots = container.children;
      for (let i = 0; i < maxLen; i++) {
        if (i < pin.length) {
          dots[i].className = 'w-4 h-4 rounded-full bg-primary shadow-[0_0_12px_rgba(59,130,246,0.6)] transition-all duration-150 scale-105';
        } else {
          dots[i].className = 'w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-150 scale-100';
        }
      }
    }

    const keypad = document.getElementById('keypad');
    if (keypad) {
      keypad.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const key = btn.getAttribute('data-key');
        const action = btn.getAttribute('data-action');

        if (key && pin.length < maxLen) {
          pin += key;
          renderDots();
          if (pin.length === maxLen) {
            setTimeout(() => {
              pin = '';
              renderDots();
            }, 600);
          }
        } else if (action === 'backspace' && pin.length > 0) {
          pin = pin.slice(0, -1);
          renderDots();
        }
      });
    }
  })();
