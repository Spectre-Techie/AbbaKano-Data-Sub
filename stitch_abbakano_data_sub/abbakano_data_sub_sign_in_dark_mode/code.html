<!-- Main Login Card -->
<div class="bg-[#151b2b] border border-white/[0.08] rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col gap-4"><div class="flex flex-col gap-1.5"><label class="text-xs font-semibold text-slate-300" for="identifier">Phone Number or Email</label><div class="relative flex items-center bg-[#0e1422] border border-slate-700/70 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500/50 rounded-xl transition-all shadow-inner"><span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg select-none">phone_iphone</span><input class="w-full h-12 py-3 pl-11 pr-11 bg-transparent text-sm text-white placeholder:text-slate-500 rounded-xl outline-none tracking-wide" id="identifier" name="identifier" placeholder="e.g. 0803 459 2811" type="text" value="0803 459 2811"/><button aria-label="Clear identifier" class="absolute right-3 w-8 h-8 flex items-center justify-center text-slate-500 hover:text-slate-300 rounded-full transition-colors" id="clear-btn" type="button"><span class="material-symbols-outlined text-lg">cancel</span></button></div></div><div class="flex flex-col gap-1.5"><div class="flex items-center justify-between"><label class="text-xs font-semibold text-slate-300" for="password">Password</label><button class="text-xs font-semibold text-blue-400 hover:text-blue-300 hover:underline transition-colors" type="button">Forgot Password?</button></div><div class="relative flex items-center bg-[#0e1422] border border-slate-700/70 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500/50 rounded-xl transition-all shadow-inner"><span class="material-symbols-outlined absolute left-3.5 text-slate-400 text-lg select-none">lock</span><input class="w-full h-12 py-3 pl-11 pr-11 bg-transparent text-sm text-white placeholder:text-slate-500 rounded-xl outline-none tracking-widest" id="password" name="password" placeholder="••••••••••••" type="password" value="••••••••••••"/><button aria-label="Toggle password visibility" class="absolute right-3 w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white transition-colors" id="toggle-pwd-btn" type="button"><span class="material-symbols-outlined text-lg" id="eye-icon">visibility</span></button></div></div><div class="flex items-center justify-between pt-1 select-none"><label class="flex items-center gap-2.5 cursor-pointer" for="remember"><div class="relative inline-block w-11 h-6 align-middle transition duration-200"><input checked="" class="peer sr-only" id="remember" name="remember" type="checkbox"/><div class="block w-11 h-6 rounded-full bg-slate-800 border border-slate-700 peer-checked:bg-blue-600 peer-checked:border-blue-500 transition-colors duration-200"></div><div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 peer-checked:translate-x-5 shadow-sm"></div></div><span class="text-xs sm:text-sm font-medium text-slate-200">Remember this device</span></label><div class="flex items-center text-emerald-400/90 gap-1 bg-emerald-950/40 border border-emerald-500/20 px-2 py-0.5 rounded-full"><span class="material-symbols-outlined text-sm">verified_user</span><span class="text-[11px] font-bold tracking-wide text-emerald-300">Secured</span></div></div><button class="mt-2 w-full h-13 py-3.5 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-600 text-white text-sm font-bold rounded-xl shadow-[0_4px_18px_rgba(37,99,235,0.35)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" id="login-btn" type="button"><span>Sign In to Wallet</span><span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span></button></div>
<!-- Divider -->
<div class="flex items-center my-4 px-1"><div class="flex-1 h-[1px] bg-white/[0.08]"></div><span class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider">Or continue with</span><div class="flex-1 h-[1px] bg-white/[0.08]"></div></div>
<!-- Biometric Quick Login Button -->
<button class="w-full h-12 bg-[#151b2b] hover:bg-[#1c2438] border border-white/[0.08] text-white text-sm font-semibold rounded-xl flex items-center justify-center gap-3 shadow-sm transition-all active:scale-[0.98]" id="biometric-btn" type="button"><div class="w-7 h-7 rounded-lg bg-blue-500/15 border border-blue-500/30 flex items-center justify-center text-blue-400"><span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">fingerprint</span></div><span>Sign In with Biometrics</span></button>
<!-- Quick Help & Registration Footer -->
<div class="mt-5 flex flex-col items-center gap-3.5 text-center"><div class="flex items-center justify-center gap-1.5 text-center"><span class="text-sm text-slate-400">Don't have an account?</span><a class="text-sm text-blue-400 font-bold hover:text-blue-300 hover:underline transition-colors" href="#">Register Now</a></div><button class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#151b2b] border border-white/[0.08] hover:bg-[#1a2236] transition-colors" type="button"><span class="w-2.5 h-2.5 rounded-full bg-[#25D366] shadow-[0_0_8px_#25D366] animate-pulse"></span><span class="text-xs font-medium text-slate-300">Need help? Contact WhatsApp Support</span><span class="material-symbols-outlined text-sm text-slate-400">chat</span></button></div>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const eyeIcon = document.getElementById('eye-icon');
    const clearBtn = document.getElementById('clear-btn');
    const idInput = document.getElementById('identifier');
    const rememberCheckbox = document.getElementById('remember');
    const rememberLabel = document.querySelector('.toggle-label');
    const biometricBtn = document.getElementById('biometric-btn');
    const loginBtn = document.getElementById('login-btn');

    // Toggle Password Visibility
    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPwd = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPwd ? 'text' : 'password');
        eyeIcon.textContent = isPwd ? 'visibility_off' : 'visibility';
        pwdInput.classList.toggle('tracking-widest', !isPwd);
      });
    }

    // Clear identifier input
    if (clearBtn && idInput) {
      clearBtn.addEventListener('click', () => {
        idInput.value = '';
        idInput.focus();
      });
    }

    // Interactive custom toggle reflection
    if (rememberCheckbox && rememberLabel) {
      const updateToggleColor = () => {
        if (rememberCheckbox.checked) {
          rememberLabel.classList.remove('bg-surface-container-highest');
          rememberLabel.classList.add('bg-primary-container');
        } else {
          rememberLabel.classList.remove('bg-primary-container');
          rememberLabel.classList.add('bg-surface-container-highest');
        }
      };
      rememberCheckbox.addEventListener('change', updateToggleColor);
      updateToggleColor();
    }

    // Biometric feedback micro-interaction
    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        const iconSpan = biometricBtn.querySelector('.material-symbols-outlined');
        if (iconSpan) {
          iconSpan.textContent = 'hourglass_top';
          setTimeout(() => {
            iconSpan.textContent = 'check_circle';
            setTimeout(() => {
              iconSpan.textContent = 'fingerprint';
            }, 1200);
          }, 600);
        }
      });
    }

    // Login CTA tap feedback
    if (loginBtn) {
      loginBtn.addEventListener('click', () => {
        const origText = loginBtn.querySelector('span:first-child').textContent;
        loginBtn.querySelector('span:first-child').textContent = 'Connecting...';
        setTimeout(() => {
          loginBtn.querySelector('span:first-child').textContent = origText;
        }, 1000);
      });
    }
  })();
</script></main></body></html>
