ff", "on-secondary": "#ffffff", "outline": "#747683" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-2xl": "3rem", "margin": "1.5rem", "margin-mobile": "1rem", "gutter-mobile": "0.75rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xs": "0.25rem", "space-md": "1rem", "space-xl": "2rem" }, "fontFamily": { "label-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "title-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"] }, "fontSize": { "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "title-lg": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-sm": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go Back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="font-title-lg text-title-lg text-on-surface font-bold">Sign In</h1></div><div class="flex items-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1U-L8H3B--tTCl8jbe_oZEnFk35OyRHx-qZdxo7hhAxg0YLC1ePpKDeX1jzH1V8HEuHsq9XrBdApsq-cVkdxbHvONIK_Mv2dbs4YEkBVWFXRkRqUkpuuY7F1uQuBWnwq-nKkd_3bZYlotd9dO-Phrip6u1cEgV3i7J0sB3Ub9SBtWc0p8LDfpNC3yylVMTnT44stnRpxRl-9FhduYKhni0_DuU2or3ZJG__mhdm4ZOWJnt7Ys3MaPt8QM6p7EmK2GUj0sfHYwiQ8w"/></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface px-margin-mobile"><div class="flex flex-col w-full max-w-[480px] mx-auto pb-space-xl">
<!-- Brand & Greeting Panel -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="relative w-16 h-16 rounded-full p-space-xs bg-surface-container-lowest shadow-md flex items-center justify-center mb-space-md">
<img alt="AbbaKano Data Sub Logo" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_xjObpWooELw_mgzx-DPNYUypXZVnqNtkcA7dfcW5Ln9kJud-PF8IG6U7xC2bih6nNVVjgc4nYoHNzByirm3-VTN_LzDXKh6-ryZ1CINsWQ80TSkbtR7a3lHLkeQFvHcaXXo4wGm23Hil3e2y7IgwbT-GTH-LiSoRq00O1whAh2s9A_wz_EqzCtqB850MFnmTTMX4VWa2HR1nAknYqBebJnQOmf7tEUDA5M9zWJScA41TB_HuZPiu-PV4bO8caHSBCnc"/>
<span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-secondary-container rounded-full ring-2 ring-surface"></span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight">
      Welcome Back 👋
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 max-w-[280px]">
      Sign in to access your wallet and purchase instant data.
    </p>
</div>
<!-- Main Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-sm flex flex-col gap-space-md">
<!-- Identifier Input (Phone or Email) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-semibold" for="identifier">
        Phone Number or Email
      </label>
<div class="relative flex items-center">
<div class="absolute left-4 text-on-surface-variant/70 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px]">phone_iphone</span>
</div>
<input class="w-full h-[52px] pl-11 pr-11 bg-surface-container-low focus:bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 outline-none transition-all duration-200 focus:shadow-[0_0_0_2px_rgba(11,60,149,0.15)]" id="identifier" placeholder="e.g. 0803 459 2811" type="text" value="0803 459 2811"/>
<button aria-label="Clear identifier" class="absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-variant/50 hover:text-on-surface rounded-full transition-colors" id="clear-btn" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-semibold" for="password">
          Password
        </label>
<button class="font-label-md text-label-md text-primary-container font-semibold hover:underline" type="button">
          Forgot Password?
        </button>
</div>
<div class="relative flex items-center">
<div class="absolute left-4 text-on-surface-variant/70 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-[52px] pl-11 pr-11 bg-surface-container-low focus:bg-surface-container-lowest rounded-lg font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 outline-none transition-all duration-200 focus:shadow-[0_0_0_2px_rgba(11,60,149,0.15)] tracking-widest" id="password" placeholder="Enter your security code" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-3 w-8 h-8 flex items-center justify-center text-on-surface-variant/60 hover:text-on-surface rounded-full transition-colors" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember device toggle -->
<div class="flex items-center justify-between pt-1">
<div class="flex items-center gap-2.5">
<div class="relative inline-block w-10 h-6 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-surface-container-lowest shadow-sm appearance-none cursor-pointer transition-transform duration-200 ease-in-out top-0.5 left-0.5 checked:translate-x-4 checked:bg-surface-container-lowest" id="remember" name="remember" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary-container cursor-pointer transition-colors duration-200" for="remember"></label>
</div>
<label class="font-body-md text-body-md text-on-surface cursor-pointer select-none" for="remember">
          Remember this device
        </label>
</div>
<div class="flex items-center text-on-surface-variant/70 gap-1">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm">Secured</span>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[54px] bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-2 shadow-[0_8px_20px_-4px_rgba(11,60,149,0.35)] active:scale-[0.98] transition-all duration-150 mt-2" id="login-btn" type="button">
<span>Sign In to Wallet</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center my-space-md px-space-xs">
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
<span class="px-space-md font-label-md text-label-md text-on-surface-variant/80">
      Or continue with
    </span>
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
</div>
<!-- Biometric Quick Login Button -->
<button class="w-full h-[52px] bg-surface-container-lowest hover:bg-surface-container text-on-surface font-label-lg text-label-lg rounded-full flex items-center justify-center gap-3 shadow-sm transition-all duration-150 active:scale-[0.98]" id="biometric-btn" type="button">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</div>
<span>Sign In with Biometrics</span>
</button>
<!-- Quick Help & Registration Footer -->
<div class="mt-space-lg flex flex-col items-center gap-space-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
      Don't have an account? 
      <button class="font-label-lg text-label-lg text-primary-container hover:underline ml-1 font-bold" type="button">
        Register Now
      </button>
</p>
<!-- Support Link Pill -->
<button class="inline-flex items-center gap-2 px-space-md py-2 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors" type="button">
<div class="w-2.5 h-2.5 rounded-full bg-[#25D366] shadow-[0_0_8px_#25D366]"></div>
<span class="font-label-md text-label-md text-on-surface-variant font-medium">Need help? Contact WhatsApp Support</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">chat</span>
</button>
</div>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const eyeIcon = document.getElementById('eye-icon');
    const clearBtn = document.getElementById('clear-btn');
    const idInput = document.getElementById('identifier');
    const rememberCheckbox = document.getElementById('remember');
    const rememberLabel = document.querySelector('.toggle-label');
    const biometricBtn = document.getElementById('biometric-btn');
    const loginBtn = document.getElementById('login-btn');

    // Toggle Password Visibility
    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPwd = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPwd ? 'text' : 'password');
        eyeIcon.textContent = isPwd ? 'visibility_off' : 'visibility';
        pwdInput.classList.toggle('tracking-widest', !isPwd);
      });
    }

    // Clear identifier input
    if (clearBtn && idInput) {
      clearBtn.addEventListener('click', () => {
        idInput.value = '';
        idInput.focus();
      });
    }

    // Interactive custom toggle reflection
    if (rememberCheckbox && rememberLabel) {
      const updateToggleColor = () => {
        if (rememberCheckbox.checked) {
          rememberLabel.classList.remove('bg-surface-container-highest');
          rememberLabel.classList.add('bg-primary-container');
        } else {
          rememberLabel.classList.remove('bg-primary-container');
          rememberLabel.classList.add('bg-surface-container-highest');
        }
      };
      rememberCheckbox.addEventListener('change', updateToggleColor);
      updateToggleColor();
    }

    // Biometric feedback micro-interaction
    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        const iconSpan = biometricBtn.querySelector('.material-symbols-outlined');
        if (iconSpan) {
          iconSpan.textContent = 'hourglass_top';
          setTimeout(() => {
            iconSpan.textContent = 'check_circle';
            setTimeout(() => {
              iconSpan.textContent = 'fingerprint';
            }, 1200);
          }, 600);
        }
      });
    }

    // Login CTA tap feedback
    if (loginBtn) {
      loginBtn.addEventListener('click', () => {
        const origText = loginBtn.querySelector('span:first-child').textContent;
        loginBtn.querySelector('span:first-child').textContent = 'Connecting...';
        setTimeout(() => {
          loginBtn.querySelector('span:first-child').textContent = origText;
        }, 1000);
      });
    }
  })();
</script></main></body></html>
