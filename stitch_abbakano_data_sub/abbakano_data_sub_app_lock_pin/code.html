</div>
</div>
<script>
  // Tactile micro-interactions for PIN keypad feedback
  const keypadButtons = document.querySelectorAll('.keypad-btn');
  const bioTrigger = document.getElementById('biometric-trigger');
  const bioFeedback = document.getElementById('bio-feedback');

  keypadButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(15);
      }
    });
  });

  if (bioTrigger && bioFeedback) {
    bioTrigger.addEventListener('click', () => {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate([20, 50, 20]);
      }
      bioFeedback.classList.remove('opacity-0');
      setTimeout(() => {
        bioFeedback.classList.add('opacity-0');
      }, 2000);
    });
  }
